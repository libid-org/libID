name: Live end-to-end

# Binds a real platform identity from the browser UI to a mined transaction:
# real OAuth sign-in, real notary, in-browser proving, the real libID contracts
# on a local anvil with Google's keys rotated in by the keeper, and the
# indexer. Not a required check: it depends on the platforms, their test
# accounts and the network.
#
# Every third-party action is pinned by commit SHA, with the tag in a comment.

on:
  pull_request:
    paths:
      - "ts/**"
      - ".github/workflows/live-e2e.yml"
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"

# One run at a time: runs share the platforms' test accounts.
concurrency:
  group: live-e2e
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bind:
    name: GitHub and X bindings (live)
    # A pull request from a fork gets no secrets, so it does not run.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # A missing secret fails the run instead of skipping the test.
      LIBID_REQUIRE_LIVE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-ts

      - name: Install Chromium
        run: pnpm -C ts --filter @libid/bind exec playwright install --with-deps chromium

      # Google is left out: it challenges a saved session arriving from a
      # runner's address ("Verify it's you"), which no automation passes. Its
      # test still runs locally, and the stack rotates no Google keys here.
      - name: Bind GitHub and X identities end to end
        env:
          LIBID_LIVE_PLATFORMS: github,x
          LIBID_STACK_LOGS: ${{ runner.temp }}/stack.log
          GH_TEST_ALICE_USERNAME: ${{ secrets.GH_TEST_ALICE_USERNAME }}
          GH_TEST_ALICE_PASSWORD: ${{ secrets.GH_TEST_ALICE_PASSWORD }}
          GH_TEST_ALICE_TOTP_SECRET: ${{ secrets.GH_TEST_ALICE_TOTP_SECRET }}
          X_TEST_ALICE_USERNAME: ${{ secrets.X_TEST_ALICE_USERNAME }}
          # The saved X session, base64 of libid-server-rs' `ceremony export x`.
          X_TEST_ALICE_COOKIES: ${{ secrets.X_TEST_ALICE_COOKIES }}
        run: pnpm -C ts/apps/bind test:live

      # The artifact is public: only screenshots, Playwright's error notes and
      # the container log go up, and only when none of them holds a secret.
      - name: Check the failure output for secrets
        id: scan
        if: failure()
        env:
          # A session that is not configured is nothing to look for.
          LIBID_REQUIRE_LIVE: ""
          GH_TEST_ALICE_PASSWORD: ${{ secrets.GH_TEST_ALICE_PASSWORD }}
          GH_TEST_ALICE_TOTP_SECRET: ${{ secrets.GH_TEST_ALICE_TOTP_SECRET }}
          X_TEST_ALICE_COOKIES: ${{ secrets.X_TEST_ALICE_COOKIES }}
        run: node ts/apps/bind/e2e/scan-secrets.ts ts/apps/bind/test-results "${{ runner.temp }}/stack.log"

      - name: Keep the screenshots and container logs
        if: failure() && steps.scan.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-e2e
          path: |
            ts/apps/bind/test-results/**/*.png
            ts/apps/bind/test-results/**/*.md
            ${{ runner.temp }}/stack.log
          retention-days: 14
          if-no-files-found: ignore
