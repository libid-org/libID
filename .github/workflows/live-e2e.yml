name: Live end-to-end

# Proves a real platform identity from the browser UI through the CCDP
# ceremony: real OAuth sign-in, the real notary and Bridge, and in-browser
# proving. No chain. Not a required check: it depends on the platforms, their
# test accounts and the network.
#
# Every third-party action is pinned by commit SHA, with the tag in a comment.

on:
  pull_request:
    paths:
      - "ts/**"
      - ".github/workflows/live-e2e.yml"
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"

# One run per pull request, a newer push replacing an older run; scheduled
# and dispatched runs queue in a group of their own. Runs of different groups
# overlap on the platforms' test accounts, which hold concurrent sign-ins:
# each run has its own notary and Bridge, and a rate-limited login backs off.
concurrency:
  group: live-e2e-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ceremony:
    name: Live ceremonies
    # A pull request from a fork or from Dependabot gets no secrets, so it
    # does not run.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    # The test step's budget plus setup, the secret scan and the upload.
    timeout-minutes: 50
    env:
      # A missing secret fails the run instead of skipping the test.
      LIBID_REQUIRE_LIVE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-ts

      - name: Install Chromium
        run: pnpm -C ts --filter @libid/ceremony-live exec playwright install --with-deps chromium

      # The platforms are the repository variable LIBID_LIVE_PLATFORMS, else
      # GitHub and X. Google is left out by default: it has challenged a saved
      # session arriving from a runner's address ("Verify it's you"), which no
      # automation passes. Its test still runs locally.
      # Its own timeout, so a run that hangs still reaches the steps below:
      # the stack's 10-minute start, two tests of 12 minutes, and 2 minutes
      # to stop the stack (playwright.live.config.ts), with room to spare.
      - name: Prove identities end to end
        id: test
        timeout-minutes: 40
        env:
          LIBID_LIVE_PLATFORMS: ${{ vars.LIBID_LIVE_PLATFORMS || 'github,x' }}
          LIBID_STACK_LOGS: ${{ runner.temp }}/stack.log
          GH_TEST_ALICE_USERNAME: ${{ secrets.GH_TEST_ALICE_USERNAME }}
          GH_TEST_ALICE_PASSWORD: ${{ secrets.GH_TEST_ALICE_PASSWORD }}
          GH_TEST_ALICE_TOTP_SECRET: ${{ secrets.GH_TEST_ALICE_TOTP_SECRET }}
          X_TEST_ALICE_USERNAME: ${{ secrets.X_TEST_ALICE_USERNAME }}
          # The saved X session, base64 of `ceremony export x` from
          # libid-server-rs' ceremony-tests (branch feat/live-ceremony-tests,
          # libid-server-rs PR #12).
          X_TEST_ALICE_COOKIES: ${{ secrets.X_TEST_ALICE_COOKIES }}
          GOOGLE_TEST_ALICE_EMAIL: ${{ secrets.GOOGLE_TEST_ALICE_EMAIL }}
          # The saved Google session: base64 of a Playwright storage state or
          # of `ceremony export google`.
          GOOGLE_TEST_ALICE_COOKIES: ${{ secrets.GOOGLE_TEST_ALICE_COOKIES }}
        run: pnpm -C ts/apps/ceremony-live test:live

      # The artifact is public. Screenshots, Playwright's error notes and the
      # stack's log go up only when the scan finds none of the test accounts'
      # secrets in them. The scan reads bytes, not pixels: a screenshot shows
      # what the page showed, and the pages driven never display the password,
      # the TOTP secret or a session cookie. The job log carries none of the
      # stack's output (playwright.live.config.ts).
      # A timed-out test step counts too; a cancelled run uploads nothing.
      - name: Check the failure output for secrets
        id: scan
        if: ${{ !cancelled() && (steps.test.outcome == 'failure' || steps.test.outcome == 'cancelled') }}
        env:
          # A session that is not configured is nothing to look for.
          LIBID_REQUIRE_LIVE: ""
          GH_TEST_ALICE_PASSWORD: ${{ secrets.GH_TEST_ALICE_PASSWORD }}
          GH_TEST_ALICE_TOTP_SECRET: ${{ secrets.GH_TEST_ALICE_TOTP_SECRET }}
          X_TEST_ALICE_COOKIES: ${{ secrets.X_TEST_ALICE_COOKIES }}
          GOOGLE_TEST_ALICE_COOKIES: ${{ secrets.GOOGLE_TEST_ALICE_COOKIES }}
        # A stack the test step left running stops first, so nothing writes to
        # the log after it is scanned; what goes up is the copy scanned.
        run: |
          docker compose ls -q --all --filter name=libid-ceremony-live |
            xargs -r -I{} docker compose -p {} down --volumes
          if [ -f "$RUNNER_TEMP/stack.log" ]; then cp "$RUNNER_TEMP/stack.log" "$RUNNER_TEMP/stack-scanned.log"; fi
          node ts/apps/ceremony-live/e2e/scan-secrets.ts ts/apps/ceremony-live/test-results "$RUNNER_TEMP/stack-scanned.log"

      - name: Keep the screenshots and container logs
        if: ${{ !cancelled() && steps.scan.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-e2e
          path: |
            ts/apps/ceremony-live/test-results/**/*.png
            ts/apps/ceremony-live/test-results/**/*.md
            ${{ runner.temp }}/stack-scanned.log
          retention-days: 14
          if-no-files-found: ignore

  # Google challenges a saved session arriving from a runner's address, and not
  # from grndd-testnet's NAT address. This job routes the test browser through
  # the Squid proxy in that cluster: an OIDC role that only this workflow on
  # main assumes, allowed to port-forward to the proxy in namespace libid-e2e
  # (grndd-systems/deployment, terraform/envs/grndd-testnet/libid-live-e2e.tf).
  google:
    name: Google ceremony through grndd-testnet (live)
    # Runs while the repository variable LIBID_GOOGLE_RUNNER is `cluster`, and
    # only on main: the role trusts nothing else.
    if: >-
      vars.LIBID_GOOGLE_RUNNER == 'cluster' &&
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      LIBID_REQUIRE_LIVE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-ts

      - name: Install Chromium
        run: pnpm -C ts --filter @libid/ceremony-live exec playwright install --with-deps chromium

      - uses: aws-actions/configure-aws-credentials@a03048d87541d1d9fcf2ecf528a4a65ba9bd7838 # v5.0.0
        with:
          role-to-assume: arn:aws:iam::849996548040:role/grndd-testnet-libid-live-e2e
          aws-region: eu-central-1

      # The port-forward runs for the rest of the job; the step fails unless
      # the proxy answers, and prints the address Google will see.
      - name: Reach the Google proxy in grndd-testnet
        run: |
          aws eks update-kubeconfig --name grndd-testnet --region eu-central-1
          kubectl -n libid-e2e port-forward svc/google-proxy 3128:3128 >"$RUNNER_TEMP/port-forward.log" 2>&1 &
          for _ in $(seq 1 30); do
            ip=$(curl -fs --max-time 5 -x http://127.0.0.1:3128 https://api.ipify.org) && break
            sleep 2
          done
          echo "Google sees ${ip:?the proxy did not answer; see $RUNNER_TEMP/port-forward.log}"

      - name: Prove a Google identity end to end
        id: test
        timeout-minutes: 20
        env:
          LIBID_LIVE_PLATFORMS: google
          LIBID_TEST_PROXY: http://127.0.0.1:3128
          LIBID_STACK_LOGS: ${{ runner.temp }}/stack.log
          GOOGLE_TEST_ALICE_EMAIL: ${{ secrets.GOOGLE_TEST_ALICE_EMAIL }}
          GOOGLE_TEST_ALICE_COOKIES: ${{ secrets.GOOGLE_TEST_ALICE_COOKIES }}
        run: pnpm -C ts/apps/ceremony-live test:live

      # As in the ceremony job: nothing goes up unless the scan finds no secret.
      - name: Check the failure output for secrets
        id: scan
        if: ${{ !cancelled() && (steps.test.outcome == 'failure' || steps.test.outcome == 'cancelled') }}
        env:
          LIBID_REQUIRE_LIVE: ""
          GOOGLE_TEST_ALICE_COOKIES: ${{ secrets.GOOGLE_TEST_ALICE_COOKIES }}
        run: |
          docker compose ls -q --all --filter name=libid-ceremony-live |
            xargs -r -I{} docker compose -p {} down --volumes
          if [ -f "$RUNNER_TEMP/stack.log" ]; then cp "$RUNNER_TEMP/stack.log" "$RUNNER_TEMP/stack-scanned.log"; fi
          node ts/apps/ceremony-live/e2e/scan-secrets.ts ts/apps/ceremony-live/test-results "$RUNNER_TEMP/stack-scanned.log"

      - name: Keep the screenshots and container logs
        if: ${{ !cancelled() && steps.scan.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-e2e-google
          path: |
            ts/apps/ceremony-live/test-results/**/*.png
            ts/apps/ceremony-live/test-results/**/*.md
            ${{ runner.temp }}/stack-scanned.log
          retention-days: 14
          if-no-files-found: ignore

  google-ssm:
    name: Google ceremony through an SSM-reached proxy (live)
    # Runs while the repository variable LIBID_GOOGLE_RUNNER is `ssm`, on a
    # dispatch or the schedule. The proxy is an EC2 instance with no inbound
    # port: LIBID_GOOGLE_PROXY_ROLE may only open an SSM port-forward to
    # LIBID_GOOGLE_PROXY_INSTANCE.
    if: >-
      vars.LIBID_GOOGLE_RUNNER == 'ssm' &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      LIBID_REQUIRE_LIVE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-ts

      - name: Install Chromium
        run: pnpm -C ts --filter @libid/ceremony-live exec playwright install --with-deps chromium

      - uses: aws-actions/configure-aws-credentials@a03048d87541d1d9fcf2ecf528a4a65ba9bd7838 # v5.0.0
        with:
          role-to-assume: ${{ vars.LIBID_GOOGLE_PROXY_ROLE }}
          aws-region: eu-central-1

      # The port-forward runs for the rest of the job; the step fails unless
      # the proxy answers, and prints the address Google will see.
      - name: Reach the Google proxy over SSM
        env:
          INSTANCE: ${{ vars.LIBID_GOOGLE_PROXY_INSTANCE }}
        run: |
          if ! command -v session-manager-plugin >/dev/null; then
            curl -fsSLo "$RUNNER_TEMP/smp.deb" https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb
            sudo dpkg -i "$RUNNER_TEMP/smp.deb"
          fi
          aws ssm start-session --target "$INSTANCE" \
            --document-name AWS-StartPortForwardingSession \
            --parameters portNumber=3128,localPortNumber=3128 >"$RUNNER_TEMP/port-forward.log" 2>&1 &
          for _ in $(seq 1 30); do
            ip=$(curl -fs --max-time 5 -x http://127.0.0.1:3128 https://api.ipify.org) && break
            sleep 2
          done
          echo "Google sees ${ip:?the proxy did not answer; see $RUNNER_TEMP/port-forward.log}"

      - name: Prove a Google identity end to end
        id: test
        timeout-minutes: 20
        env:
          LIBID_LIVE_PLATFORMS: google
          LIBID_TEST_PROXY: http://127.0.0.1:3128
          LIBID_STACK_LOGS: ${{ runner.temp }}/stack.log
          GOOGLE_TEST_ALICE_EMAIL: ${{ secrets.GOOGLE_TEST_ALICE_EMAIL }}
          GOOGLE_TEST_ALICE_COOKIES: ${{ secrets.GOOGLE_TEST_ALICE_COOKIES }}
        run: pnpm -C ts/apps/ceremony-live test:live

      # As in the ceremony job: nothing goes up unless the scan finds no secret.
      - name: Check the failure output for secrets
        id: scan
        if: ${{ !cancelled() && (steps.test.outcome == 'failure' || steps.test.outcome == 'cancelled') }}
        env:
          LIBID_REQUIRE_LIVE: ""
          GOOGLE_TEST_ALICE_COOKIES: ${{ secrets.GOOGLE_TEST_ALICE_COOKIES }}
        run: |
          docker compose ls -q --all --filter name=libid-ceremony-live |
            xargs -r -I{} docker compose -p {} down --volumes
          if [ -f "$RUNNER_TEMP/stack.log" ]; then cp "$RUNNER_TEMP/stack.log" "$RUNNER_TEMP/stack-scanned.log"; fi
          node ts/apps/ceremony-live/e2e/scan-secrets.ts ts/apps/ceremony-live/test-results "$RUNNER_TEMP/stack-scanned.log"

      - name: Keep the screenshots and container logs
        if: ${{ !cancelled() && steps.scan.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-e2e-google-ssm
          path: |
            ts/apps/ceremony-live/test-results/**/*.png
            ts/apps/ceremony-live/test-results/**/*.md
            ${{ runner.temp }}/stack-scanned.log
          retention-days: 14
          if-no-files-found: ignore

  # The Google ceremony on a self-hosted runner (label libid-google), for a
  # runner on a machine whose address Google accepts. Opt-in: it runs only
  # while the repository variable LIBID_GOOGLE_RUNNER is `self-hosted`, since a
  # job for a missing runner would sit queued. It never runs for a pull
  # request: only a manual dispatch, which needs write access, or the
  # schedule, which runs main.
  google-self-hosted:
    name: Google ceremony on a self-hosted runner (live)
    if: >-
      vars.LIBID_GOOGLE_RUNNER == 'self-hosted' &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    runs-on: [self-hosted, libid-google]
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      LIBID_REQUIRE_LIVE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-ts

      - name: Install Chromium
        run: pnpm -C ts --filter @libid/ceremony-live exec playwright install --with-deps chromium

      - name: Show the address Google will see
        run: echo "Google sees $(curl -fs --max-time 10 https://api.ipify.org)"

      - name: Prove a Google identity end to end
        id: test
        timeout-minutes: 20
        env:
          LIBID_LIVE_PLATFORMS: google
          LIBID_STACK_LOGS: ${{ runner.temp }}/stack.log
          GOOGLE_TEST_ALICE_EMAIL: ${{ secrets.GOOGLE_TEST_ALICE_EMAIL }}
          GOOGLE_TEST_ALICE_COOKIES: ${{ secrets.GOOGLE_TEST_ALICE_COOKIES }}
        run: pnpm -C ts/apps/ceremony-live test:live

      - name: Check the failure output for secrets
        id: scan
        if: ${{ !cancelled() && (steps.test.outcome == 'failure' || steps.test.outcome == 'cancelled') }}
        env:
          LIBID_REQUIRE_LIVE: ""
          GOOGLE_TEST_ALICE_COOKIES: ${{ secrets.GOOGLE_TEST_ALICE_COOKIES }}
        run: |
          docker compose ls -q --all --filter name=libid-ceremony-live |
            xargs -r -I{} docker compose -p {} down --volumes
          if [ -f "$RUNNER_TEMP/stack.log" ]; then cp "$RUNNER_TEMP/stack.log" "$RUNNER_TEMP/stack-scanned.log"; fi
          node ts/apps/ceremony-live/e2e/scan-secrets.ts ts/apps/ceremony-live/test-results "$RUNNER_TEMP/stack-scanned.log"

      - name: Keep the screenshots and container logs
        if: ${{ !cancelled() && steps.scan.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-e2e-google-self-hosted
          path: |
            ts/apps/ceremony-live/test-results/**/*.png
            ts/apps/ceremony-live/test-results/**/*.md
            ${{ runner.temp }}/stack-scanned.log
          retention-days: 14
          if-no-files-found: ignore
