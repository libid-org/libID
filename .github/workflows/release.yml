name: Release

# A published GitHub Release's tag selects what it publishes:
# - `ccdp-v<version>` promotes the CCDP image of the tagged commit, which must
#   be on main, to `ghcr.io/libid-org/ccdp:<version>` (plus `:latest` for a
#   stable version). CCDP versions are their own, never a package's.
# - `v<version>` publishes @libid/claim and @libid/claim-full (whose version
#   tracks claim's) to npm. The tag is a pointer, never a source: it must equal
#   both package.json versions. npm auth is token-first (org NPM_TOKEN secret)
#   with OIDC trusted publishing as the fallback — same model as libid-contracts.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify-tag:
    name: Release tag matches its source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, so origin/main is present for the ancestry check.
          fetch-depth: 0
          persist-credentials: false
      - name: A CCDP tag is on main; a package tag equals the package versions
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [[ "$TAG" == ccdp-v* ]]; then
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
              echo "::error::$TAG targets $GITHUB_SHA, which is not on main; only main publications are released"
              exit 1
            }
            echo "tag: $TAG  commit: $GITHUB_SHA (on main)"
            exit 0
          fi
          version="${TAG#v}"
          for dir in claim claim-full; do
            pkg=$(node -p "require('./ts/packages/$dir/package.json').version")
            echo "tag: $TAG  $dir: $pkg"
            [ "$version" = "$pkg" ] || { echo "::error::tag $TAG != @libid/$dir version $pkg"; exit 1; }
          done

  publish-npm:
    name: Publish @libid/claim + @libid/claim-full to npm
    if: ${{ !startsWith(github.event.release.tag_name, 'ccdp-v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [verify-tag]
    environment: npm-deploy
    permissions:
      id-token: write
      contents: read
    env:
      # Public repo: provenance attestation is on.
      NPM_CONFIG_PROVENANCE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-ts

      - name: Update npm for OIDC trusted publishing
        run: npm install -g npm@latest && npm --version

      - name: Build and test
        run: |
          pnpm -C ts build
          pnpm -C ts test

      # Derive the dist-tag: a prerelease publishes under its first
      # prerelease identifier (1.2.0-rc.1 -> rc), a plain version -> latest.
      - name: Derive dist-tag from version
        id: dist-tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          base="${version%%+*}"
          if [ "$base" != "${base#*-}" ]; then
            pre="${base#*-}"
            dist_tag="${pre%%.*}"
            printf '%s' "$dist_tag" | grep -qE '^[A-Za-z][A-Za-z0-9._-]*$' || {
              echo "::error::prerelease identifier '$dist_tag' is not a usable npm dist-tag" >&2
              exit 1
            }
          else
            dist_tag=latest
          fi
          echo "dist-tag=$dist_tag" >> "$GITHUB_OUTPUT"

      # From the package directories, not `pnpm -C` (pnpm 10 mangles
      # forwarded flags under -C). Token-first with OIDC fallback, as in
      # libid-contracts. claim first: claim-full's workspace:^ dep resolves
      # to it. claim-full's assets/ tree was staged by its build above and
      # rides in the tarball via `files`.
      - name: pnpm publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${NPM_TOKEN}" ]; then
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> "$HOME/.npmrc"
            echo "Authenticating with the org npm token"
          else
            echo "No NPM_TOKEN secret; relying on OIDC trusted publishing"
          fi
          for dir in claim claim-full; do
            (cd "ts/packages/$dir" \
              && pnpm publish --access public --no-git-checks --tag "${{ steps.dist-tag.outputs.dist-tag }}")
          done

  # ---------------------------------------------------------------------------
  # CCDP image: publish the released commit's image under the version. The
  # image that ci.yml built, tested and pushed as `sha-<commit sha>` when the
  # commit landed on main is promoted — retagged registry-side by digest, no
  # rebuild — so the release image is byte-identical to the tested one and
  # needs no retention seed. The tag is the full sha, and the image's own
  # labels must name this commit as a main publication, so a promotion cannot
  # pick up another commit's image or a custom build. A release never builds:
  # without that image the job fails, because only images published from main
  # enter the `:main` retention history every later build seeds from.
  # ---------------------------------------------------------------------------
  publish-ccdp-image:
    name: Publish the CCDP image
    if: startsWith(github.event.release.tag_name, 'ccdp-v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [verify-tag]
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/libid-org/ccdp
    steps:
      # `<version>` is the tag after `ccdp-v`, such as `1` or `1.2.0`; a `-`
      # marks a prerelease, which never moves `latest`.
      - name: Derive the image tags from the release version
        id: tags
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${TAG#ccdp-v}"
          printf '%s' "$version" | grep -qE '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$' || {
            echo "::error::version '$version' is not usable as an image tag" >&2
            exit 1
          }
          tags="$IMAGE:$version"
          if [ "$version" = "${version#*-}" ]; then
            tags="$tags"$'\n'"$IMAGE:latest"
          fi
          echo "$tags"
          { echo "tags<<EOF"; echo "$tags"; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # `--prefer-index=false`: with a single source, imagetools would otherwise
      # wrap a plain manifest in a new index, which has a different digest.
      # "not found" means the commit's main run did not publish (still running,
      # failed, or superseded while queued): the fix is to re-run its
      # ccdp-publish, never to build here. Before retagging, the labels baked in
      # by ccdp-image.yml must name the released commit as a main publication:
      # the tag alone is a mutable pointer. `.Image` is one config for a plain
      # manifest and a per-platform map for an index.
      - name: Promote the tested main image of this commit
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          set -euo pipefail
          source="$IMAGE:sha-$GITHUB_SHA"
          if ! digest=$(docker buildx imagetools inspect "$source" --format '{{json .Manifest.Digest}}' \
              2>"$RUNNER_TEMP/inspect.err" | jq -r .); then
            cat "$RUNNER_TEMP/inspect.err"
            if grep -qiE 'not found|manifest unknown|name unknown' "$RUNNER_TEMP/inspect.err"; then
              echo "::error::no tested main image for $GITHUB_SHA: re-run the ccdp-publish job of its main CI run, then re-publish the release"
            else
              echo "::error::could not inspect $source; fix the cause and re-run"
            fi
            exit 1
          fi
          echo "$source is $digest"
          labels=$(docker buildx imagetools inspect "$IMAGE@$digest" --format '{{json .Image}}' \
            | jq -c 'if has("config") then . else .["linux/amd64"] end | .config.Labels // {}')
          revision=$(jq -r '.["org.opencontainers.image.revision"] // empty' <<<"$labels")
          built_as=$(jq -r '.["org.opencontainers.image.version"] // empty' <<<"$labels")
          if [ "$revision" != "$GITHUB_SHA" ]; then
            echo "::error::$source carries revision '${revision:-none}', not $GITHUB_SHA; refusing to promote"
            exit 1
          fi
          if [ "$built_as" != "main" ]; then
            echo "::error::$source is a '${built_as:-unlabelled}' build, not a main publication; refusing to promote"
            exit 1
          fi
          echo "$source was published from main at $revision"
          args=()
          for ref in $TAGS; do args+=(-t "$ref"); done
          docker buildx imagetools create --prefer-index=false "${args[@]}" "$IMAGE@$digest"
          {
            echo "### CCDP image promoted"
            echo
            echo "- \`$source\` = \`$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"
          for ref in $TAGS; do
            got=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest.Digest}}' | jq -r .)
            echo "$ref is $got"
            [ "$got" = "$digest" ] || { echo "::error::$ref resolved to $got, not $digest"; exit 1; }
            echo "- \`$ref\` = \`$got\`" >> "$GITHUB_STEP_SUMMARY"
          done
