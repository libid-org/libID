name: Release

# Publishing a GitHub Release tagged `v<version>` publishes @libid/claim
# and @libid/claim-full (whose version tracks claim's) to npm, and the CCDP
# image to ghcr as `ghcr.io/libid-org/ccdp:<version>` (plus `:latest` for a
# stable version). The tag is a pointer, never a source: it must equal both
# package.json versions. npm auth is token-first (org NPM_TOKEN secret) with
# OIDC trusted publishing as the fallback — same model as libid-contracts.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify-tag:
    name: Release tag matches version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag equals package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          for dir in claim claim-full; do
            pkg=$(node -p "require('./ts/packages/$dir/package.json').version")
            echo "tag: $TAG  $dir: $pkg"
            [ "$version" = "$pkg" ] || { echo "::error::tag $TAG != @libid/$dir version $pkg"; exit 1; }
          done

  publish-npm:
    name: Publish @libid/claim + @libid/claim-full to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [verify-tag]
    environment: npm-deploy
    permissions:
      id-token: write
      contents: read
    env:
      # Public repo: provenance attestation is on.
      NPM_CONFIG_PROVENANCE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ts/pnpm-lock.yaml

      - name: Update npm for OIDC trusted publishing
        run: npm install -g npm@latest && npm --version

      - name: Install dependencies
        run: pnpm -C ts install --frozen-lockfile

      - name: Build and test
        run: |
          pnpm -C ts build
          pnpm -C ts test

      # Derive the dist-tag: a prerelease publishes under its first
      # prerelease identifier (1.2.0-rc.1 -> rc), a plain version -> latest.
      - name: Derive dist-tag from version
        id: dist-tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          base="${version%%+*}"
          if [ "$base" != "${base#*-}" ]; then
            pre="${base#*-}"
            dist_tag="${pre%%.*}"
            printf '%s' "$dist_tag" | grep -qE '^[A-Za-z][A-Za-z0-9._-]*$' || {
              echo "::error::prerelease identifier '$dist_tag' is not a usable npm dist-tag" >&2
              exit 1
            }
          else
            dist_tag=latest
          fi
          echo "dist-tag=$dist_tag" >> "$GITHUB_OUTPUT"

      # From the package directories, not `pnpm -C` (pnpm 10 mangles
      # forwarded flags under -C). Token-first with OIDC fallback, as in
      # libid-contracts. claim first: claim-full's workspace:^ dep resolves
      # to it. claim-full's assets/ tree was staged by its build above and
      # rides in the tarball via `files`.
      - name: pnpm publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${NPM_TOKEN}" ]; then
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> "$HOME/.npmrc"
            echo "Authenticating with the org npm token"
          else
            echo "No NPM_TOKEN secret; relying on OIDC trusted publishing"
          fi
          for dir in claim claim-full; do
            (cd "ts/packages/$dir" \
              && pnpm publish --access public --no-git-checks --tag "${{ steps.dist-tag.outputs.dist-tag }}")
          done

  # ---------------------------------------------------------------------------
  # CCDP image: publish the released commit's image under the version. The
  # image that ci.yml built, tested and pushed as `sha-<short sha>` when the
  # commit landed on main is promoted — retagged registry-side by digest, no
  # rebuild — so the release image is byte-identical to the tested one and
  # needs no retention seed. Only when no such image exists (a release cut
  # before that job existed, or whose main run failed) does the next job build,
  # test and push it from source through the reusable workflow.
  # ---------------------------------------------------------------------------
  publish-ccdp-image:
    name: Publish the CCDP image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [verify-tag]
    permissions:
      contents: read
      packages: write
    outputs:
      promoted: ${{ steps.promote.outputs.promoted }}
      tags: ${{ steps.tags.outputs.tags }}
    env:
      IMAGE: ghcr.io/libid-org/ccdp
    steps:
      # `<version>` is the tag without its `v`, as on npm; a `-` marks a
      # prerelease (the dist-tag rule above), which never moves `latest`.
      - name: Derive the image tags from the release version
        id: tags
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          printf '%s' "$version" | grep -qE '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$' || {
            echo "::error::version '$version' is not usable as an image tag" >&2
            exit 1
          }
          tags="$IMAGE:$version"
          if [ "$version" = "${version#*-}" ]; then
            tags="$tags"$'\n'"$IMAGE:latest"
          fi
          echo "$tags"
          { echo "tags<<EOF"; echo "$tags"; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # `--prefer-index=false`: with a single source, imagetools would otherwise
      # wrap a plain manifest in a new index, which has a different digest.
      # "not found" is the one inspect failure that means "build instead"; any
      # other (registry, auth) fails the job rather than silently rebuilding.
      - name: Promote the tested main image of this commit
        id: promote
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          set -euo pipefail
          source="$IMAGE:sha-${GITHUB_SHA:0:7}"
          if ! digest=$(docker buildx imagetools inspect "$source" --format '{{json .Manifest.Digest}}' \
              2>"$RUNNER_TEMP/inspect.err" | jq -r .); then
            cat "$RUNNER_TEMP/inspect.err"
            if ! grep -qiE 'not found|manifest unknown|name unknown' "$RUNNER_TEMP/inspect.err"; then
              echo "::error::could not inspect $source; fix the cause (or re-run) rather than rebuilding"
              exit 1
            fi
            echo "No image at $source (this commit never published from main); building it from source instead."
            echo "### CCDP image: no tested main image at \`$source\`; building from source" >> "$GITHUB_STEP_SUMMARY"
            echo "promoted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$source is $digest"
          args=()
          for ref in $TAGS; do args+=(-t "$ref"); done
          docker buildx imagetools create --prefer-index=false "${args[@]}" "$IMAGE@$digest"
          {
            echo "### CCDP image promoted"
            echo
            echo "- \`$source\` = \`$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"
          for ref in $TAGS; do
            got=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest.Digest}}' | jq -r .)
            echo "$ref is $got"
            [ "$got" = "$digest" ] || { echo "::error::$ref resolved to $got, not $digest"; exit 1; }
            echo "- \`$ref\` = \`$got\`" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "promoted=true" >> "$GITHUB_OUTPUT"

  build-ccdp-image:
    name: CCDP image from source
    needs: [publish-ccdp-image]
    if: needs.publish-ccdp-image.outputs.promoted != 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ccdp-image.yml
    with:
      push: true
      tags: ${{ needs.publish-ccdp-image.outputs.tags }}
