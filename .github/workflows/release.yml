name: Release

# A published GitHub Release's tag selects what it publishes:
# - `<popup|ledger|ceremony>-v<version>` publishes that npm package.
# - `ccdp-v<version>` promotes the CCDP image of the tagged commit, which must
#   be on main, to `ghcr.io/libid-org/ccdp:<version>` (plus `:latest` for a
#   stable version). CCDP versions are their own, never a package's.
# Any other tag fails the release rather than publishing nothing.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  known-tag:
    name: Release tag names a release scheme
    if: ${{ !startsWith(github.event.release.tag_name, 'ccdp-v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject the unknown tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          echo "::error::$TAG matches no release scheme (ccdp-v<version>); nothing was published"
          exit 1

  verify-tag:
    name: CCDP release tag points to main
    if: startsWith(github.event.release.tag_name, 'ccdp-v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, so origin/main is present for the ancestry check.
          fetch-depth: 0
          persist-credentials: false
      - name: The CCDP tag is on main
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::$TAG targets $GITHUB_SHA, which is not on main; only main publications are released"
            exit 1
          }
          echo "tag: $TAG  commit: $GITHUB_SHA (on main)"

  # ---------------------------------------------------------------------------
  # CCDP image: publish the released commit's image under the version. The
  # image that ci.yml built, tested and pushed as `sha-<commit sha>` when the
  # commit landed on main is promoted — retagged registry-side by digest, no
  # rebuild — so the release image is byte-identical to the tested one. The
  # tag is the full sha, and the image's own labels must name this commit as a
  # main publication, so a promotion cannot pick up another commit's image or
  # a custom build. A release never builds: without that image the job fails.
  # ---------------------------------------------------------------------------
  publish-ccdp-image:
    name: Publish the CCDP image
    if: startsWith(github.event.release.tag_name, 'ccdp-v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [verify-tag]
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/libid-org/ccdp
    steps:
      # `<version>` is the tag after `ccdp-v`, such as `1` or `1.2.0`; a `-`
      # marks a prerelease, which never moves `latest`.
      - name: Derive the image tags from the release version
        id: tags
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${TAG#ccdp-v}"
          printf '%s' "$version" | grep -qE '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$' || {
            echo "::error::version '$version' is not usable as an image tag" >&2
            exit 1
          }
          tags="$IMAGE:$version"
          if [ "$version" = "${version#*-}" ]; then
            tags="$tags"$'\n'"$IMAGE:latest"
          fi
          echo "$tags"
          { echo "tags<<EOF"; echo "$tags"; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # `--prefer-index=false`: with a single source, imagetools would otherwise
      # wrap a plain manifest in a new index, which has a different digest.
      # "not found" means the commit's main run did not publish (still running,
      # failed, or superseded while queued): the fix is to re-run its
      # ccdp-publish, never to build here. Before retagging, the labels baked in
      # by ccdp-image.yml must name the released commit as a main publication:
      # the tag alone is a mutable pointer. `.Image` is one config for a plain
      # manifest and a per-platform map for an index.
      - name: Promote the tested main image of this commit
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          set -euo pipefail
          source="$IMAGE:sha-$GITHUB_SHA"
          if ! digest=$(docker buildx imagetools inspect "$source" --format '{{json .Manifest.Digest}}' \
              2>"$RUNNER_TEMP/inspect.err" | jq -r .); then
            cat "$RUNNER_TEMP/inspect.err"
            if grep -qiE 'not found|manifest unknown|name unknown' "$RUNNER_TEMP/inspect.err"; then
              echo "::error::no tested main image for $GITHUB_SHA: re-run the ccdp-publish job of its main CI run, then re-publish the release"
            else
              echo "::error::could not inspect $source; fix the cause and re-run"
            fi
            exit 1
          fi
          echo "$source is $digest"
          labels=$(docker buildx imagetools inspect "$IMAGE@$digest" --format '{{json .Image}}' \
            | jq -c 'if has("config") then . else .["linux/amd64"] end | .config.Labels // {}')
          revision=$(jq -r '.["org.opencontainers.image.revision"] // empty' <<<"$labels")
          built_as=$(jq -r '.["org.opencontainers.image.version"] // empty' <<<"$labels")
          if [ "$revision" != "$GITHUB_SHA" ]; then
            echo "::error::$source carries revision '${revision:-none}', not $GITHUB_SHA; refusing to promote"
            exit 1
          fi
          if [ "$built_as" != "main" ]; then
            echo "::error::$source is a '${built_as:-unlabelled}' build, not a main publication; refusing to promote"
            exit 1
          fi
          echo "$source was published from main at $revision"
          args=()
          for ref in $TAGS; do args+=(-t "$ref"); done
          docker buildx imagetools create --prefer-index=false "${args[@]}" "$IMAGE@$digest"
          {
            echo "### CCDP image promoted"
            echo
            echo "- \`$source\` = \`$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"
          for ref in $TAGS; do
            got=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest.Digest}}' | jq -r .)
            echo "$ref is $got"
            [ "$got" = "$digest" ] || { echo "::error::$ref resolved to $got, not $digest"; exit 1; }
            echo "- \`$ref\` = \`$got\`" >> "$GITHUB_STEP_SUMMARY"
          done

  publish-npm:
    name: Publish an npm package
    if: startsWith(github.event.release.tag_name, 'popup-v') || startsWith(github.event.release.tag_name, 'ledger-v') || startsWith(github.event.release.tag_name, 'ceremony-v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select a package version with successful main CI
        id: package
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$TAG" in
            popup-v*) package=popup ;;
            ledger-v*) package=ledger ;;
            ceremony-v*) package=ceremony ;;
            *) exit 1 ;;
          esac
          version=$(node -p "require('./ts/packages/$package/package.json').version")
          [ "$TAG" = "$package-v$version" ] || {
            echo "::error::$TAG does not match $package's package.json version $version"
            exit 1
          }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          runs=$(gh run list --workflow ci.yml --branch main --event push \
            --commit "$GITHUB_SHA" --status success --json databaseId --jq 'length')
          [ "$runs" -gt 0 ] || {
            echo "::error::wait for successful main CI for $GITHUB_SHA before releasing"
            exit 1
          }
          dist_tag=latest
          if [[ "$version" == *-* || "$PRERELEASE" == true ]]; then dist_tag=next; fi
          { echo "name=$package"; echo "dist-tag=$dist_tag"; } >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-ts

      # npm 11 bundled with Node 24 supports trusted publishing. No registry token:
      # configure release.yml as a trusted publisher on each existing npm package.
      - name: Build and test the packed packages
        run: pnpm -C ts test:packages

      - name: Publish the checked tarball with npm OIDC
        env:
          PACKAGE: ${{ steps.package.outputs.name }}
          DIST_TAG: ${{ steps.package.outputs.dist-tag }}
        run: npm publish "ts/.cache/npm/$PACKAGE.tgz" --access public --tag "$DIST_TAG"
