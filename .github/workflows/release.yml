name: Release

# A published GitHub Release's tag selects what it publishes:
# - `packages-v<YYYY.MM.DD>` publishes to npm, in dependency order, every package
#   under `ts/packages` whose package.json version npm lacks. Another release on
#   the same day appends `.<n>`, such as `packages-v2026.10.20.2`.
# - `ccdp-v<version>` promotes the CCDP image of the tagged commit, which must
#   be on main, to `ghcr.io/libid-org/ccdp:<version>` (plus `:latest` for a
#   stable version). CCDP versions are their own, never a package's.
# Any other tag fails the release rather than publishing nothing.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  known-tag:
    name: Release tag names a release scheme
    if: ${{ !startsWith(github.event.release.tag_name, 'packages-v') && !startsWith(github.event.release.tag_name, 'ccdp-v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject the unknown tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          echo "::error::$TAG matches no release scheme (packages-v<YYYY.MM.DD> or ccdp-v<version>); nothing was published"
          exit 1

  verify-tag:
    name: CCDP release tag points to main
    if: startsWith(github.event.release.tag_name, 'ccdp-v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, so origin/main is present for the ancestry check.
          fetch-depth: 0
          persist-credentials: false
      - name: The CCDP tag is on main
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::$TAG targets $GITHUB_SHA, which is not on main; only main publications are released"
            exit 1
          }
          echo "tag: $TAG  commit: $GITHUB_SHA (on main)"

  # ---------------------------------------------------------------------------
  # CCDP image: publish the released commit's image under the version. The
  # image that ci.yml built, tested and pushed as `sha-<commit sha>` when the
  # commit landed on main is promoted — retagged registry-side by digest, no
  # rebuild — so the release image is byte-identical to the tested one. The
  # tag is the full sha, and the image's own labels must name this commit as a
  # main publication, so a promotion cannot pick up another commit's image or
  # a custom build. A release never builds: without that image the job fails.
  # ---------------------------------------------------------------------------
  publish-ccdp-image:
    name: Publish the CCDP image
    if: startsWith(github.event.release.tag_name, 'ccdp-v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [verify-tag]
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/libid-org/ccdp
    steps:
      # `<version>` is the tag after `ccdp-v`, such as `1` or `1.2.0`; a `-`
      # marks a prerelease, which never moves `latest`.
      - name: Derive the image tags from the release version
        id: tags
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${TAG#ccdp-v}"
          printf '%s' "$version" | grep -qE '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$' || {
            echo "::error::version '$version' is not usable as an image tag" >&2
            exit 1
          }
          tags="$IMAGE:$version"
          if [ "$version" = "${version#*-}" ]; then
            tags="$tags"$'\n'"$IMAGE:latest"
          fi
          echo "$tags"
          { echo "tags<<EOF"; echo "$tags"; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # `--prefer-index=false`: with a single source, imagetools would otherwise
      # wrap a plain manifest in a new index, which has a different digest.
      # "not found" means the commit's main run did not publish (still running,
      # failed, or superseded while queued): the fix is to re-run its
      # ccdp-publish, never to build here. Before retagging, the labels baked in
      # by ccdp-image.yml must name the released commit as a main publication:
      # the tag alone is a mutable pointer. `.Image` is one config for a plain
      # manifest and a per-platform map for an index.
      - name: Promote the tested main image of this commit
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          set -euo pipefail
          source="$IMAGE:sha-$GITHUB_SHA"
          if ! digest=$(docker buildx imagetools inspect "$source" --format '{{json .Manifest.Digest}}' \
              2>"$RUNNER_TEMP/inspect.err" | jq -r .); then
            cat "$RUNNER_TEMP/inspect.err"
            if grep -qiE 'not found|manifest unknown|name unknown' "$RUNNER_TEMP/inspect.err"; then
              echo "::error::no tested main image for $GITHUB_SHA: re-run the ccdp-publish job of its main CI run, then re-publish the release"
            else
              echo "::error::could not inspect $source; fix the cause and re-run"
            fi
            exit 1
          fi
          echo "$source is $digest"
          labels=$(docker buildx imagetools inspect "$IMAGE@$digest" --format '{{json .Image}}' \
            | jq -c 'if has("config") then . else .["linux/amd64"] end | .config.Labels // {}')
          revision=$(jq -r '.["org.opencontainers.image.revision"] // empty' <<<"$labels")
          built_as=$(jq -r '.["org.opencontainers.image.version"] // empty' <<<"$labels")
          if [ "$revision" != "$GITHUB_SHA" ]; then
            echo "::error::$source carries revision '${revision:-none}', not $GITHUB_SHA; refusing to promote"
            exit 1
          fi
          if [ "$built_as" != "main" ]; then
            echo "::error::$source is a '${built_as:-unlabelled}' build, not a main publication; refusing to promote"
            exit 1
          fi
          echo "$source was published from main at $revision"
          args=()
          for ref in $TAGS; do args+=(-t "$ref"); done
          docker buildx imagetools create --prefer-index=false "${args[@]}" "$IMAGE@$digest"
          {
            echo "### CCDP image promoted"
            echo
            echo "- \`$source\` = \`$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"
          for ref in $TAGS; do
            got=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest.Digest}}' | jq -r .)
            echo "$ref is $got"
            [ "$got" = "$digest" ] || { echo "::error::$ref resolved to $got, not $digest"; exit 1; }
            echo "- \`$ref\` = \`$got\`" >> "$GITHUB_STEP_SUMMARY"
          done

  # ---------------------------------------------------------------------------
  # npm packages: one job builds and checks the tarballs and plans the versions
  # npm lacks, without publishing rights; the next publishes exactly those
  # tarballs and runs no repository code.
  # ---------------------------------------------------------------------------
  check-npm:
    name: Check the npm package release
    if: startsWith(github.event.release.tag_name, 'packages-v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: The tag names a main commit with successful CI
        env:
          TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^packages-v[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$ ]] || {
            echo "::error::$TAG is not packages-v<YYYY.MM.DD>, or packages-v<YYYY.MM.DD>.<n> for another release that day"
            exit 1
          }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::$TAG targets $GITHUB_SHA, which is not on main"
            exit 1
          }
          runs=$(gh run list --workflow ci.yml --branch main --event push \
            --commit "$GITHUB_SHA" --status success --json databaseId --jq 'length')
          [ "$runs" -gt 0 ] || {
            echo "::error::wait for successful main CI for $GITHUB_SHA before releasing"
            exit 1
          }

      - uses: ./.github/actions/setup-ts

      - name: Build and test the packed packages
        run: pnpm -C ts test:packages

      # One `<tarball> <name> <version> <dist-tag>` line per package version npm
      # lacks, in publication order. It fails when no version is new, or when a
      # planned package's @libid dependency is neither on npm nor planned before it.
      - name: Plan the versions npm lacks
        id: plan
        env:
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          plan=$(node ts/scripts/plan-release.ts "${flags[@]}")
          echo "$plan"
          { echo "plan<<EOF"; echo "$plan"; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-packages
          path: ts/.cache/npm/*.tgz
          if-no-files-found: error
          retention-days: 1

  publish-npm:
    name: Publish the npm packages
    needs: check-npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Each package's npm trusted publisher accepts only this environment, which
    # deploys only release tags (ts/RELEASING.md). A workflow edited on a branch
    # therefore cannot publish, and the OIDC token never meets repository code.
    environment: npm-release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-packages

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # No checkout in this job, so ts/.node-version is not available.
          node-version: 26

      - name: Use an npm with trusted publishing
        run: npm install -g npm@^11.5.1

      # In the planned order. A version already on npm is skipped, so re-running
      # a partly published release publishes the rest.
      - name: Publish the checked tarballs with npm OIDC
        env:
          PLAN: ${{ needs.check-npm.outputs.plan }}
        run: |
          set -euo pipefail
          mapfile -t plan <<<"$PLAN"
          for entry in "${plan[@]}"; do
            read -r tarball name version dist_tag <<<"$entry"
            published=$(npm view "$name" versions --json)
            if jq -e --arg version "$version" 'any(.[]; . == $version)' <<<"$published" >/dev/null; then
              echo "$name@$version is already on npm"
              continue
            fi
            npm publish "$tarball" --access public --tag "$dist_tag"
          done
