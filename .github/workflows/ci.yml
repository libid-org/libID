name: CI

# TypeScript and Solidity checks, workspace browser tests, CCDP image and DCO.
#
# Every third-party action is pinned by commit SHA, with the tag in a
# comment, so a moved tag cannot change what executes.

on:
  pull_request:
  push:
    branches: [main]

# A pull request's newer run cancels its older one. Each push to main has its own
# group, so every main commit completes its checks; ccdp-publish serializes the
# publications themselves.
concurrency:
  group: ci-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Changes: which browser workspaces a pull request can affect, and whether it
  # can affect the CCDP image, so their jobs skip otherwise. Pushes to main run
  # everything: a release promotes each main commit's own image. Plain git over
  # the PR's range, as in DCO.
  # ---------------------------------------------------------------------------
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      workspaces: ${{ steps.paths.outputs.workspaces }}
      image: ${{ steps.paths.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Affected workspaces
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo 'workspaces=["popup","ceremony","dev"]' >> "$GITHUB_OUTPUT"
            echo "image=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          # What every job builds on: the TypeScript workspace setup and CI itself.
          shared='^(ts/(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|tsconfig\.base\.json|scripts/)|\.github/(workflows/(ci|ccdp-image)\.yml|actions/setup-ts/))'
          # The ceremony and the workspace packages it bundles.
          ceremony='^ts/packages/(ceremony|popup|ledger)/'
          changed() { grep -qE "$shared|$1" <<<"$files"; }
          workspaces=()
          if changed '^ts/packages/popup/'; then workspaces+=(popup); fi
          if changed "$ceremony"; then workspaces+=(ceremony); fi
          if changed "$ceremony|^ts/apps/dev/"; then workspaces+=(dev); fi
          image=false
          if changed "$ceremony"; then image=true; fi
          json=$(jq -cn '$ARGS.positional' --args "${workspaces[@]}")
          echo "Browser workspaces: $json; CCDP image: $image"
          { echo "workspaces=$json"; echo "image=$image"; } >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # TypeScript: build, tests, complete source/test/build-script type checking,
  # lint and formatting.
  # ---------------------------------------------------------------------------
  ts:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm, Node and the frozen-lockfile install, pinned in one place.
      - uses: ./.github/actions/setup-ts

      - name: Build
        run: pnpm -C ts build

      - name: Packed npm consumer
        run: pnpm -C ts test:packages

      - name: Type checking
        run: pnpm -C ts typecheck

      # Ceremony runs under coverage, whose thresholds gate the job.
      - name: Tests
        run: |
          pnpm -C ts --filter '!@libid/ceremony' --filter '!{.}' test
          pnpm -C ts/packages/ceremony test:coverage

      - name: Keep the ceremony coverage summary for the badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ceremony-coverage
          path: ts/packages/ceremony/coverage/coverage-summary.json
          retention-days: 1
          if-no-files-found: error

      - name: Lint and formatting
        run: pnpm -C ts lint && pnpm -C ts fmt:check

  # ---------------------------------------------------------------------------
  # Solidity: LibID, tested against the real libID contracts placed at their
  # canonical addresses. The fork tests run against Ethereum mainnet, Sepolia
  # and Eden testnet through public RPCs, on local forks.
  # ---------------------------------------------------------------------------
  sol:
    name: Solidity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: sol
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.7.1

      - name: LibIDTestnet is generated from LibID
        run: ./script/testnet.sh && git diff --exit-code -- src/LibIDTestnet.sol

      - name: Formatting
        run: forge fmt --check

      - name: Lint
        run: forge lint -D notes

      # The oldest compiler the README promises, on the legacy pipeline,
      # building LibID.sol alone as an integrator's project would.
      - name: LibID and LibIDTestnet compile with solc 0.8.20
        env:
          FOUNDRY_VIA_IR: "false"
          FOUNDRY_OUT: ${{ runner.temp }}/libid-0.8.20/out
          FOUNDRY_CACHE_PATH: ${{ runner.temp }}/libid-0.8.20/cache
        run: forge build src/LibID.sol src/LibIDTestnet.sol --use 0.8.20 --evm-version paris

      - name: Tests
        run: forge test -vv

      # LIBID_REQUIRE_FORK turns a missing RPC into a failure, not a skip.
      - name: Mainnet, Sepolia and Eden fork tests
        env:
          ETH_RPC_URL: https://ethereum-rpc.publicnode.com
          SEPOLIA_RPC_URL: https://ethereum-sepolia-rpc.publicnode.com
          EDEN_RPC_URL: https://ev-reth-eden-testnet.binarybuilders.services:8545
          LIBID_REQUIRE_FORK: "true"
        run: forge test -vv --match-contract 'ForkTest$'

  # ---------------------------------------------------------------------------
  # Ceremony coverage badge: on pushes to main, publish the unit-test line
  # coverage the TypeScript job measured as a shields.io endpoint on the orphan
  # `badges` branch, replaced each run. Only this job holds `contents: write`,
  # pull requests never run it, and it runs no repository code.
  # ---------------------------------------------------------------------------
  coverage-badge:
    name: Ceremony coverage badge
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ts]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ceremony-coverage
          path: coverage

      - name: Publish the badge
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          badge=$(mktemp -d)
          node -e '
            const { pct } = JSON.parse(require("fs").readFileSync(process.argv[1])).total.lines
            const color = pct >= 90 ? "brightgreen" : pct >= 80 ? "yellow" : "red"
            console.log(JSON.stringify({ schemaVersion: 1, label: "coverage", message: `${pct.toFixed(1)}%`, color }))
          ' coverage/coverage-summary.json > "$badge/ceremony-coverage.json"
          cd "$badge"
          git init -q -b badges
          git add ceremony-coverage.json
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -qm "Ceremony coverage for $GITHUB_SHA"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges

  # ---------------------------------------------------------------------------
  # CCDP image: build the static ceremony artifact and the pinned SWS image for
  # linux/amd64, prove the image against the running container and the pinned
  # native binary, and publish it to ghcr on pushes to main. The steps live in
  # the reusable ccdp-image.yml. A release only promotes the `sha-<commit sha>`
  # image published here to the release version; it never builds one.
  #
  # Two callers so the token matches the run. Pull requests execute
  # PR-controlled build code, so they get a read-only token (the called
  # workflow inherits these permissions and cannot widen them) and never push.
  # Only a push to main holds `packages: write`, and only it publishes.
  # ---------------------------------------------------------------------------
  ccdp-image:
    name: CCDP image
    needs: [changes]
    if: (github.event_name != 'push' || github.ref != 'refs/heads/main') && needs.changes.outputs.image == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/ccdp-image.yml

  # Publications run one at a time and a running one is never cancelled, so
  # every main commit gets its `sha-<commit sha>` image. A third push while one
  # runs replaces the queued one; re-run that commit's ccdp-publish before
  # releasing it.
  ccdp-publish:
    name: CCDP image (publish)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: ccdp-publish
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ccdp-image.yml
    with:
      push: true
      # `sha-<commit sha>` is what a release promotes; `:main` names the latest build.
      sha_tag: true
      tag: main

  # ---------------------------------------------------------------------------
  # DCO: every commit carries a Signed-off-by trailer. Plain git over the
  # event's commit range — no marketplace action, so there is nothing to pin
  # and nothing to compromise.
  # ---------------------------------------------------------------------------
  dco:
    name: DCO
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the PR base and the push's `before` are reachable
          # only in a complete clone, and the repo is small.
          fetch-depth: 0

      - name: Every commit is signed off
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="$BASE_SHA..$HEAD_SHA"
          else
            # Push to main. `before` is all zeros on a branch creation and
            # may be unreachable after a force push; in either case there is
            # no honest range, so fall back to the head commit alone rather
            # than failing on plumbing.
            zero="0000000000000000000000000000000000000000"
            if [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "$zero" ] \
              && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
              range="$PUSH_BEFORE..$PUSH_AFTER"
            else
              echo "No usable push range; checking only the head commit."
              range="$PUSH_AFTER^!"
            fi
          fi

          # Merge commits are exempt, as in the standard DCO probot: nobody
          # authors a merge, and the merged commits are themselves in range.
          missing=0
          for sha in $(git rev-list --no-merges "$range"); do
            if git log -1 --format=%B "$sha" | grep -qiE '^Signed-off-by: .+ <.+>'; then
              continue
            fi
            echo "::error::commit $sha lacks a Signed-off-by trailer (use 'git commit -s')"
            missing=1
          done
          exit "$missing"

  # ---------------------------------------------------------------------------
  # Ceremony e2e assets: the qualification Distribution and the release
  # downloads, built once for every ceremony browser job.
  # ---------------------------------------------------------------------------
  ceremony-e2e-assets:
    name: Ceremony e2e assets
    needs: [changes]
    if: contains(fromJSON(needs.changes.outputs.workspaces), 'ceremony')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-ts

      - name: Build the ceremony and its dependencies
        run: pnpm -C ts --filter '@libid/ceremony...' build

      - name: Build the qualification Distribution
        working-directory: ts/packages/ceremony
        run: node build/distribution.ts --out-dir .cache/qualification-assets

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ceremony-e2e-assets
          path: |
            ts/packages/ceremony/.cache/qualification-assets
            ts/packages/ceremony/.cache/downloads
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Each workspace/engine pair has its own runner and test servers. Keep heavy
  # ceremony work serial inside a runner; independent jobs can run in parallel.
  # Popup and dev jobs still run when the ceremony assets fail to build. The
  # workspaces are the ones `changes` found affected; a matrix `include` would
  # add back the pairs a filter removed, so each pair's projects are chosen in
  # the test step.
  # ---------------------------------------------------------------------------
  browser:
    name: Browser tests (${{ matrix.workspace }}, ${{ matrix.engine }})
    needs: [changes, ceremony-e2e-assets]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.workspaces != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        workspace: ${{ fromJSON(needs.changes.outputs.workspaces) }}
        engine: [chromium, firefox, webkit]
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-ts

      - name: Build workspace and dependencies
        run: pnpm -C ts --filter '@libid/${{ matrix.workspace }}...' build

      - name: Install browser
        run: pnpm -C ts --filter '@libid/${{ matrix.workspace }}' exec playwright install --with-deps ${{ matrix.engine }}

      - name: Check browser test types
        run: pnpm -C ts --filter '@libid/${{ matrix.workspace }}' --if-present run typecheck:e2e

      # The CRS the ceremony e2e build caches once (e2e/crs.mjs). The build checks every file
      # against its pins and downloads again on a mismatch, so a restored cache is never trusted.
      - name: Restore the cached CRS
        if: matrix.workspace == 'ceremony'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ts/packages/ceremony/.cache/crs
          key: ceremony-crs-${{ hashFiles('ts/packages/ceremony/e2e/crs.pins.json') }}

      - name: Download the ceremony e2e assets
        if: matrix.workspace == 'ceremony'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ceremony-e2e-assets
          path: ts/packages/ceremony/.cache

      - name: Log in to ghcr for the matched notary image
        if: matrix.workspace == 'ceremony'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Browser tests
        env:
          CEREMONY_E2E_PREBUILT: ${{ matrix.workspace == 'ceremony' && '1' || '' }}
          PAIR: ${{ matrix.workspace }}-${{ matrix.engine }}
        run: |
          set -euo pipefail
          case "$PAIR" in
            popup-chromium) projects='--project=chromium --project=mobile-chrome' ;;
            popup-firefox) projects='--project=firefox' ;;
            popup-webkit) projects='--project=webkit --project=mobile-webkit' ;;
            ceremony-chromium) projects='--project=chromium --project=chromium-http --project=android-emulated' ;;
            ceremony-firefox) projects='--project=firefox --project=firefox-http' ;;
            ceremony-webkit) projects='--project=webkit --project=webkit-http --project=ios-emulated' ;;
            dev-chromium) projects='--project=chromium --project=android-emulated' ;;
            dev-firefox) projects='--project=firefox' ;;
            dev-webkit) projects='--project=webkit --project=ios-emulated' ;;
            *) echo "::error::no Playwright projects for $PAIR"; exit 1 ;;
          esac
          # Word-split on purpose: one argument per project.
          pnpm -C ts --filter "@libid/${{ matrix.workspace }}" run test:e2e $projects

      # A failing test keeps its Playwright trace; replay it with `npx playwright show-trace <zip>`.
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: traces-${{ matrix.workspace }}-${{ matrix.engine }}
          path: ts/*/${{ matrix.workspace }}/test-results
          retention-days: 7
          if-no-files-found: ignore
