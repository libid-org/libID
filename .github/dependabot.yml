version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/site"
    schedule:
      interval: "weekly"
    allow:
      - dependency-type: "all"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: "npm"
    directory: "/ts"
    schedule:
      interval: "weekly"
    allow:
      - dependency-type: "all"
    groups:
      proof-toolchain:
        patterns: ["@aztec/*", "@noir-lang/*"]
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: "docker-compose"
    directory: "/harness"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
