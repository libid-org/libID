name: Keep the live end-to-end failure output
description: >-
  Stop any dev stack left running, scan its log (LIBID_STACK_LOGS) for the
  test accounts' secrets, then upload the PNG screenshots and the scanned
  log. The caller passes the secrets to look for as env and runs this only
  on failure.

# Every third-party action is pinned by commit SHA, with the tag in a
# comment, so a moved tag cannot change what executes.

inputs:
  name:
    description: The artifact's name.
    required: true

runs:
  using: composite
  steps:
    # A stack the test step left running stops first, so nothing writes to
    # the log after it is scanned; what goes up is the copy scanned. A secret
    # in it fails this step, and nothing goes up.
    - name: Check the stack log for secrets
      shell: bash
      run: |
        docker compose ls -q --all --filter name=libid-dev |
          xargs -r -I{} docker compose -p {} down --volumes
        if [ -f "$LIBID_STACK_LOGS" ]; then cp "$LIBID_STACK_LOGS" "$RUNNER_TEMP/stack-scanned.log"; fi
        node ts/apps/dev/e2e/scan-secrets.ts "$RUNNER_TEMP/stack-scanned.log"

    - name: Keep the screenshots and the stack log
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.name }}
        path: |
          ts/apps/dev/test-results/**/*.png
          ${{ runner.temp }}/stack-scanned.log
        retention-days: 14
        if-no-files-found: ignore
