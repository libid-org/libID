name: Set up the TypeScript workspace
description: >-
  Install pnpm and Node with the pnpm store cached, then the ts/ workspace
  dependencies from the lockfile. Runs after actions/checkout.

# Every third-party action is pinned by commit SHA, with the tag in a
# comment, so a moved tag cannot change what executes.

runs:
  using: composite
  steps:
    # pnpm before setup-node: `cache: pnpm` shells out to pnpm to locate
    # the store, so the binary has to exist first.
    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      with:
        version: 10
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
        cache: pnpm
        cache-dependency-path: ts/pnpm-lock.yaml

    - name: Install dependencies
      shell: bash
      run: pnpm -C ts install --frozen-lockfile
