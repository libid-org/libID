# The libID integration stack: anvil + a one-shot contract deploy + the
# notary + the libID server, all from released images/binaries. The
# demo UI and its static assets stay host-side (vite dev server) — see
# boot.sh, which orchestrates the whole thing.
#
# Address hand-off: there is none at runtime, on purpose. Every entry
# contract deploys through the deterministic LibidFactory via CREATE3, so
# the addresses are the CANONICAL cross-network ones — the same here as on
# every real chain — and are pre-declared in network.local.toml
# (committed; declarative since libid-deploy 0.4.0 — apply never rewrites
# it). render-env.sh parses that file into .env, compose interpolates the
# values below as static env, and the one-shot deploy service applies the
# file directly on its read-only mount and asserts via `plan --json` that
# nothing is left to deploy.
#
# GH_OAUTH_CLIENT_ID / GH_OAUTH_CLIENT_SECRET come from the host env (dummy
# values boot the stack; a real GitHub click-through needs a real OAuth app).

services:
  anvil:
    image: ghcr.io/foundry-rs/foundry:v1.5.1
    entrypoint: ["anvil"]
    command:
      - --chain-id=31337
      # The generated UltraHonk circuit verifiers exceed the EIP-170 24KB
      # limit, exactly like the real target chains that raise it.
      - --code-size-limit=65536
      # Deliberately NOT --disable-default-create2-deployer: default anvil
      # PREDEPLOYS the keyless Arachnid CREATE2 proxy, and libid-deploy's
      # ensure_* steps are idempotent — they take the predeploy as-is and
      # skip the one-time install transaction. Either way the factory (and
      # every CREATE3 address behind it) lands on the same canonical
      # address, so the committed network.local.toml matches regardless of
      # how the deployer got there (verified: bare and default anvil
      # converge byte-identically).
      - --host=0.0.0.0
    ports:
      - "8545:8545"
    healthcheck:
      test: ["CMD", "cast", "block-number", "--rpc-url", "http://127.0.0.1:8545"]
      interval: 2s
      timeout: 5s
      retries: 30

  # One-shot: download the released libid-deploy for the container arch,
  # fresh-apply the declarative network file (read-only — apply never
  # writes), then assert `plan --json` reports nothing left to deploy.
  deploy:
    image: debian:bookworm-slim
    depends_on:
      anvil:
        condition: service_healthy
    environment:
      LIBID_DEPLOY_VERSION: "0.6.0"
      # anvil #0 — canonical public test key, the deployer.
      DEPLOYER_KEY: ac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80
    volumes:
      - ./network.local.toml:/input/network.local.toml:ro
      - ./compose/deploy.sh:/deploy.sh:ro
    entrypoint: ["bash", "/deploy.sh"]

  notary:
    image: ghcr.io/libid-org/notary:0.2.0
    depends_on:
      deploy:
        condition: service_completed_successfully
    environment:
      NOTARY_HOST: 0.0.0.0
      # anvil #1 — the notary signer (accounts.notary in network.local.toml).
      SIGNING_KEY: 59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d
      CHAIN_ID: "31337"
      # TWO DIFFERENT contracts: the MPC-TLS digest (GitHub flow, driven by
      # the backend) recovers against GitHubIdentityVerifier; the browser X
      # flow's token/me attestations recover against XIdentityVerifier.
      VERIFYING_CONTRACT_ADDRESS: ${GITHUB_IDENTITY_VERIFIER}
      X_ZK_VERIFIER_ADDRESS: ${X_IDENTITY_VERIFIER}
    ports:
      - "7047:7047"
      - "7048:7048"
    # The image carries its own HEALTHCHECK (nc on the TCP wire port).

  # One-shot JWKS keeper: closes the UntrustedModulus gap for Google claims.
  # One tick of the real production path — poll Google's live JWKS, decide
  # against the freshly deployed (empty) roots, obtain a REAL MPC-TLS
  # notarized reading of https://www.googleapis.com/oauth2/v3/certs through
  # the notary service's wire port, and submit rotate() to both JWKS
  # contracts (identity.identity_jwks_roots + contracts.google_oidc_verifier,
  # resolved from the mounted network file). Exits 0 only when every
  # rotation landed, so CI can gate on it. Needs outbound HTTPS to
  # googleapis.com (both here and inside the notary's MPC-TLS session).
  # For a long-lived local rotation loop, run instead:
  #   docker compose run --rm keeper --config /input/keeper.toml run
  keeper:
    image: ghcr.io/libid-org/keeper:0.2.0
    depends_on:
      deploy:
        condition: service_completed_successfully
      notary:
        condition: service_healthy
    volumes:
      - ./keeper.toml:/input/keeper.toml:ro
      - ./network.local.toml:/input/network.local.toml:ro
    command: ["--config", "/input/keeper.toml", "once"]

  libid-server-rs:
    image: ghcr.io/libid-org/libid-server-rs:0.2.2
    depends_on:
      deploy:
        condition: service_completed_successfully
      notary:
        condition: service_healthy
    environment:
      # The browser opens the GitHub popup against this URL, so it must be
      # host-reachable — hence localhost, not the service name. Overridable
      # because the GitHub OAuth app's registered callback pins a specific
      # host port (the wallet product's dev app uses 18722, so the extra
      # port mapping below presents the same backend there too).
      BASE_URL: ${SERVER_PUBLIC_URL:-http://localhost:8722}
      # REQUIRED for the Google flow: the backend's /auth/gmail/callback is a
      # static fragment relay that forwards the id_token to the app.
      APP_URL: http://localhost:5173
      ALLOWED_ORIGINS: http://localhost:5173
      NOTARY_URL: tcp://notary:7047
      # anvil #1 — the address of the notary signer above.
      NOTARY_ADDRESS: "0x70997970C51812dc3A010C7d01b50e0d17dc79C8"
      CHAIN_ID: "31337"
      # GitHubIdentityVerifier — NOT IdentityNames (the notary digest is
      # domain-separated by this address; see the backend README).
      VERIFIER_CONTRACT_ADDRESS: ${GITHUB_IDENTITY_VERIFIER}
      # anvil #2 — the backend countersigner (accounts.backend).
      BACKEND_SIGNING_KEY: 5de4111afa1a4b94908f83103eb1f1706367c2e68ca870fc3fb9a804cdab365a
      GH_OAUTH_CLIENT_ID: ${GH_OAUTH_CLIENT_ID:-dummy}
      GH_OAUTH_CLIENT_SECRET: ${GH_OAUTH_CLIENT_SECRET:-dummy}
    ports:
      - "8722:8722"
      # Same backend on the wallet product dev app's registered OAuth callback port.
      - "18722:8722"
    # The image carries its own /health HEALTHCHECK.
